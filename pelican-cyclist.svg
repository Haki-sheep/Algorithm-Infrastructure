  <path d="M421 352Q412 393 399 424" fill="none" stroke="#e58b43" stroke-width="13" stroke-linecap="round"/>
  <path d="M510 349Q500 405 470 475" fill="none" stroke="#e58b43" stroke-width="13" stroke-linecap="round"/>
  <path d="M399 424Q385 418 377 428Q389 434 397 435Q383 439 381 447Q397 447 404 438Q410 445 419 441Q414 427 399 424Z" fill="#f39a43" stroke="#a95d34" stroke-width="3" stroke-linejoin="round"/>
  <path d="M470 475Q454 470 448 481Q462 487 471 485Q458 490 460 499Q475 498 481 489Q489 496 498 490Q491 477 470 475Z" fill="#f39a43" stroke="#a95d34" stroke-width="3" stroke-linejoin="round"/>

