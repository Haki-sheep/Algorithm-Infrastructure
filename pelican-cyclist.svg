  <ellipse cx="466" cy="299" rx="111" ry="83" transform="rotate(-8 466 299)" fill="#fffdf5" stroke="#34434a" stroke-width="5"/>
  <path d="M420 295Q462 267 521 286Q545 297 541 319Q488 343 427 322Z" fill="#f2e8d2" stroke="#d4c7ad" stroke-width="4"/>
  <path d="M438 294Q479 279 520 296M431 308Q479 292 531 310M441 322Q482 308 524 322" fill="none" stroke="#d4c7ad" stroke-width="4" stroke-linecap="round"/>
  <path d="M487 289Q546 245 587 263L583 300Q537 294 509 331Z" fill="#fffdf5" stroke="#34434a" stroke-width="5" stroke-linejoin="round"/>

