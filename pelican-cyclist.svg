<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">戴着黄色头盔的白色鹈鹕骑着红色自行车，沿着晴朗的河岸前进。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a7e5f2"/>
      <stop offset="1" stop-color="#e7f8e8"/>
    </linearGradient>
    <linearGradient id="beak" x2="0" y2="1">
      <stop stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#f28a32"/>
    </linearGradient>
    <linearGradient id="bag" x2="0" y2="1">
      <stop stop-color="#ff806b"/>
      <stop offset="1" stop-color="#e94f57"/>
    </linearGradient>
    <g id="wheel">
      <circle r="108" fill="#fbfdff" stroke="#273944" stroke-width="12"/>
      <circle r="96" fill="none" stroke="#9fb3b8" stroke-width="3"/>
      <g stroke="#9fb3b8" stroke-width="2">
        <path d="M0-94V94M-94 0H94M-66-66L66 66M66-66L-66 66M-36-87L36 87M36-87L-36 87M-87-36L87 36M-87 36L87-36"/>
      </g>
      <circle r="10" fill="#ef7655" stroke="#273944" stroke-width="4"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="820" cy="96" r="48" fill="#ffe27a"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="162" cy="112" rx="56" ry="18"/>
    <ellipse cx="196" cy="102" rx="34" ry="23"/>
    <ellipse cx="225" cy="115" rx="42" ry="15"/>
    <ellipse cx="705" cy="183" rx="48" ry="15"/>
    <ellipse cx="735" cy="173" rx="29" ry="20"/>
  </g>
  <path d="M0 372Q180 315 365 370T730 360T960 350V510H0Z" fill="#a9d99b"/>
  <path d="M0 418Q190 362 380 412T750 400T960 392V535H0Z" fill="#74bf7d"/>
  <path d="M0 508Q240 480 480 512T960 495V640H0Z" fill="#e8d69f"/>
  <path d="M0 562Q245 535 490 564T960 548" fill="none" stroke="#fff1c7" stroke-width="8" opacity=".8"/>
  <ellipse cx="479" cy="563" rx="324" ry="24" fill="#31585b" opacity=".16"/>

  <!-- Bicycle wheels and frame -->
  <use href="#wheel" transform="translate(255 454)"/>
  <use href="#wheel" transform="translate(704 454)"/>
  <g fill="none" stroke="#e84f50" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 454L430 454L365 314L255 454"/>
    <path d="M365 314L584 321L430 454"/>
    <path d="M430 454L686 454L584 321"/>
  </g>
  <path d="M574 318L594 318" stroke="#263b46" stroke-width="13" stroke-linecap="round"/>
  <path d="M352 306L377 306" stroke="#263b46" stroke-width="12" stroke-linecap="round"/>
  <path d="M365 313L365 283M584 321L606 281" fill="none" stroke="#354e58" stroke-width="11" stroke-linecap="round"/>
  <path d="M579 280Q617 267 652 281" fill="none" stroke="#263b46" stroke-width="10" stroke-linecap="round"/>
  <path d="M345 280Q366 267 388 280" fill="none" stroke="#263b46" stroke-width="10" stroke-linecap="round"/>
  <circle cx="430" cy="454" r="17" fill="#ffd46e" stroke="#263b46" stroke-width="6"/>
  <path d="M430 454L470 476M430 454L399 428" stroke="#263b46" stroke-width="7" stroke-linecap="round"/>
  <path d="M466 479H493M388 425H414" stroke="#263b46" stroke-width="8" stroke-linecap="round"/>
  <path d="M625 345L686 454M643 337L704 446" stroke="#506772" stroke-width="4" opacity=".8"/>

  <!-- Small rear pannier -->
  <path d="M277 324Q313 304 345 321L337 374Q303 382 273 361Z" fill="url(#bag)" stroke="#773c49" stroke-width="5" stroke-linejoin="round"/>
  <path d="M282 337Q309 344 340 333" fill="none" stroke="#ffd4a5" stroke-width="5"/>
  <circle cx="310" cy="355" r="5" fill="#ffd46e"/>

