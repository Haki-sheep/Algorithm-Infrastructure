  <path d="M530 286Q543 247 546 210Q545 173 574 151L608 169Q584 193 593 226Q599 257 576 282Z" fill="#fffdf5" stroke="#34434a" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="583" cy="153" r="43" fill="#fffdf5" stroke="#34434a" stroke-width="5"/>
  <path d="M615 140Q706 113 860 145Q831 168 782 164Q698 159 614 160Z" fill="url(#beak)" stroke="#8e512f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M616 159Q702 166 784 208Q823 226 846 170Q813 204 773 190Q691 171 612 167Z" fill="#ef9b52" stroke="#8e512f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M633 164Q716 183 788 204" fill="none" stroke="#c66a3b" stroke-width="3"/>
  <circle cx="600" cy="148" r="7" fill="#253943"/>
  <circle cx="602" cy="146" r="2.5" fill="#fff"/>
  <path d="M588 132Q602 125 614 134" fill="none" stroke="#34434a" stroke-width="4" stroke-linecap="round"/>

  <!-- Helmet -->
  <path d="M541 135Q548 91 586 91Q621 92 633 129L541 135Z" fill="#ffd45f" stroke="#34434a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M539 135Q583 126 637 134L629 145Q579 138 541 146Z" fill="#ef7655" stroke="#34434a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M562 97Q568 113 565 131M589 94Q595 111 592 128M611 103Q617 116 616 131" fill="none" stroke="#fff0b4" stroke-width="4" stroke-linecap="round"/>
  <path d="M557 174Q554 199 575 208" fill="none" stroke="#34434a" stroke-width="4" stroke-linecap="round"/>

  <!-- Breeze marks -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85">
    <path d="M111 289H204M137 311H230M159 333H214"/>
  </g>
</svg>
