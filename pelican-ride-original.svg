    <path d="M399 300Q447 280 493 295"/>
  </g>
  <path d="M501 242Q524 219 526 186Q524 154 545 133Q569 119 588 137Q566 156 565 185Q570 218 548 264Z" fill="#fffaf0" stroke="#34474b" stroke-width="5" stroke-linejoin="round"/>

