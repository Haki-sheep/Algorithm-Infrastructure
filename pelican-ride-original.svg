<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="description">一只戴珊瑚红头盔的白色鹈鹕骑着红色自行车，伸出翅膀握住车把，橙色蹼足踩在踏板上。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e6eb"/>
      <stop offset="1" stop-color="#eaf7e5"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd07d"/>
      <stop offset="1" stop-color="#ee945d"/>
    </linearGradient>
    <g id="wheel">
      <circle r="103" fill="#fffdf4" stroke="#293c43" stroke-width="13"/>
      <circle r="91" fill="none" stroke="#d5e2df" stroke-width="4"/>
      <g fill="none" stroke="#9aafb3" stroke-width="2">
        <path d="M0-88V88M-88 0H88M-62-62L62 62M62-62L-62 62"/>
        <path d="M-34-81L34 81M34-81L-34 81M-81-34L81 34M-81 34L81-34"/>
      </g>
      <circle r="12" fill="#f6bd5b" stroke="#293c43" stroke-width="4"/>
    </g>
  </defs>

  <!-- Landscape -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="815" cy="99" r="49" fill="#ffe49b"/>
  <g fill="#fff" opacity=".82">
