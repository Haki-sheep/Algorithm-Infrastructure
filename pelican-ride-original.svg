  <path d="M577 128Q589 121 600 128" fill="none" stroke="#34474b" stroke-width="3" stroke-linecap="round"/>
  <path d="M537 131Q538 94 566 85Q599 75 621 115L625 132Z" fill="#d85650" stroke="#34474b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M534 132Q577 123 630 131L626 143Q575 136 537 146Z" fill="#ec7162" stroke="#34474b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M559 89Q561 108 560 128M583 86Q588 105 586 127M604 100Q610 113 609 130" fill="none" stroke="#f6aa82" stroke-width="4" stroke-linecap="round"/>
