  <use href="#wheel" transform="translate(244 454)"/>
  <use href="#wheel" transform="translate(700 454)"/>
  <path d="M244 443L451 437Q465 446 451 466L244 465Z" fill="none" stroke="#56646a" stroke-width="4"/>
  <g fill="none" stroke="#d84f4d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 454L385 326L450 450L244 454"/>
