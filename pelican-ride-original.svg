  <path d="M512 266Q549 251 592 269M505 281Q551 265 599 282" fill="none" stroke="#d0c9b7" stroke-width="3" stroke-linecap="round"/>
  <path d="M622 278Q634 273 640 281M617 286Q628 286 633 293" fill="none" stroke="#34474b" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion lines -->
  <g fill="none" stroke="#fffaf0" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M66 314H170M93 339H195M120 364H176"/>
  </g>
</svg>
