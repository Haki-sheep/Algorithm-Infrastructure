  <path d="M0 428Q162 386 335 424T686 405T960 411V558H0Z" fill="#6eae8c"/>
  <path d="M0 540Q236 513 471 541T960 527V640H0Z" fill="#e7d5a7"/>
  <path d="M0 584Q228 557 467 583T960 566" fill="none" stroke="#f8e9c7" stroke-width="9"/>
  <ellipse cx="473" cy="560" rx="333" ry="20" fill="#344d43" opacity=".16"/>

