  <path d="M602 143Q718 123 866 156Q880 161 870 173Q754 172 603 164Z" fill="#f5ad4f" stroke="#92542f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M605 164Q694 172 787 215Q840 238 868 174Q864 237 814 263Q746 268 671 223Q631 199 601 174Z" fill="url(#pouch)" stroke="#92542f" stroke-width="4" stroke-linejoin="round"/>
