    <ellipse cx="155" cy="114" rx="36" ry="25"/>
    <ellipse cx="193" cy="126" rx="46" ry="17"/>
    <ellipse cx="745" cy="199" rx="38" ry="13"/>
    <ellipse cx="777" cy="191" rx="26" ry="18"/>
  </g>
